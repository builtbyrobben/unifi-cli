version: 2

project_name: unifi-cli

changelog:
  disable: true

builds:
  - id: unifi
    main: ./cmd/unifi
    binary: unifi-cli
    ldflags: >-
      -s -w
      -X github.com/builtbyrobben/unifi-cli/internal/cmd.version={{ .Tag }}
      -X github.com/builtbyrobben/unifi-cli/internal/cmd.commit={{ .ShortCommit }}
      -X github.com/builtbyrobben/unifi-cli/internal/cmd.date={{ .Date }}
    env:
      - CGO_ENABLED=0
    targets:
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: unifi_darwin
    main: ./cmd/unifi
    binary: unifi-cli
    ldflags: >-
      -s -w
      -X github.com/builtbyrobben/unifi-cli/internal/cmd.version={{ .Tag }}
      -X github.com/builtbyrobben/unifi-cli/internal/cmd.commit={{ .ShortCommit }}
      -X github.com/builtbyrobben/unifi-cli/internal/cmd.date={{ .Date }}
    env:
      - CGO_ENABLED=1
    targets:
      - darwin_amd64
      - darwin_arm64

archives:
  - ids:
      - unifi
      - unifi_darwin
    formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: checksums.txt

brews:
  - repository:
      owner: builtbyrobben
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/builtbyrobben/unifi-cli"
    description: "UniFi network controller CLI"
    license: "MIT"
    test: |
      system "#{bin}/unifi-cli", "--version"
